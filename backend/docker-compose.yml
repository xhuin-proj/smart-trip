services:
  db:
    image: pgvector/pgvector:pg17
    container_name: smarttrip-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarttrip
    ports:
      - "5432:5432"
    volumes:
      - smarttrip_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttrip-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/smarttrip
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./app:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  smarttrip_data: